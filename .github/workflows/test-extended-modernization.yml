name: Test extended Faster-Whisper-XXL modernization

on:
  push:
    branches:
      - automation/full-modernization-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Set up bootstrap CPython
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'
      - name: Build current CPython 3.10 security release for Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 --branch v3.10.21 https://github.com/python/cpython.git cpython31021
          Push-Location cpython31021
          try {
            & .\PCbuild\build.bat -p x64 -c Release -e *>&1 | Tee-Object -FilePath ..\cpython31021-build.txt
            if ($LASTEXITCODE -ne 0) { throw "CPython build failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          $py=(Resolve-Path 'cpython31021\PCbuild\amd64\python.exe').Path
          & $py -m ensurepip --upgrade
          if ($LASTEXITCODE -ne 0) { throw 'ensurepip failed' }
          (Resolve-Path 'cpython31021\PCbuild\amd64').Path | Add-Content $env:GITHUB_PATH
      - name: Apply compatibility holds and CPython runtime overlay
        shell: pwsh
        run: |
          $p = 'tools\build_extended_candidate.ps1'
          $text = Get-Content $p -Raw
          $text = $text.Replace("'auditok==0.5.2'", "'auditok==0.2.0'")
          $needle = "Assert-Native 'stage apply'"
          $insert = @"
Assert-Native 'stage apply'
& python tools\overlay_cpython_runtime.py (Join-Path `$workspace 'cpython31021') (Join-Path `$workspace 'cpython31021\PCbuild\amd64') `$contents --output (Join-Path `$report 'cpython-runtime-overlay.json') *>&1 | Tee-Object -FilePath (Join-Path `$report 'cpython-runtime-overlay.txt')
Assert-Native 'CPython 3.10.21 runtime overlay'
"@
          if (-not $text.Contains($needle)) { throw 'stage apply insertion point not found' }
          $text = $text.Replace($needle, $insert.TrimEnd())
          $runtimeNeedle = "Status 'Running CLI smoke tests.'"
          $runtimeInsert = @"
Status 'Verifying packaged CPython 3.10.21 runtime and security libraries.'
& `$exe --xxl-runtime-info *>&1 | Tee-Object -FilePath (Join-Path `$report 'packaged-runtime-info.json')
`$runtimeRc=`$LASTEXITCODE
if (`$runtimeRc -ne 0) { throw \"Packaged runtime diagnostic failed: `$runtimeRc\" }
`$runtimeInfo=Get-Content (Join-Path `$report 'packaged-runtime-info.json') -Raw | ConvertFrom-Json
if (`$runtimeInfo.python -notmatch '^3\.10\.21') { throw \"Packaged Python is not 3.10.21: `$(`$runtimeInfo.python)\" }
if (`$runtimeInfo.python_magic -ne '6f0d0d0a') { throw \"Packaged bytecode magic mismatch: `$(`$runtimeInfo.python_magic)\" }
if (`$runtimeInfo.openssl -notmatch 'OpenSSL 1\.1\.1w') { throw \"Packaged OpenSSL is not 1.1.1w: `$(`$runtimeInfo.openssl)\" }

Status 'Running CLI smoke tests.'
"@
          if (-not $text.Contains($runtimeNeedle)) { throw 'runtime verification insertion point not found' }
          $text = $text.Replace($runtimeNeedle, $runtimeInsert.TrimEnd())
          Set-Content $p $text -Encoding utf8
      - name: Build and integration-test extended modernization
        shell: pwsh
        run: |
          python --version
          ./tools/build_extended_candidate.ps1 *>&1 | Tee-Object -FilePath extended-console.txt
      - name: Preserve console log
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extended-report | Out-Null
          if (Test-Path extended-console.txt) { Copy-Item extended-console.txt extended-report\extended-console.txt -Force }
          if (Test-Path cpython31021-build.txt) { Copy-Item cpython31021-build.txt extended-report\cpython31021-build.txt -Force }
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-xxl-extended-modernization-report
          path: extended-report
          if-no-files-found: error
          retention-days: 14
