name: Probe modern RTX 50 runtime

on:
  push:
    branches:
      - automation/faster-whisper-xxl-rtx50-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Download and extract original release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work, report, wheels, stage | Out-Null
          $url = 'https://github.com/Purfview/whisper-standalone-win/releases/download/Faster-Whisper-XXL/Faster-Whisper-XXL_r245.4_windows.7z'
          curl.exe -L --fail --retry 5 --retry-delay 5 --output work\original.7z $url
          $hash = (Get-FileHash work\original.7z -Algorithm SHA256).Hash
          if ($hash -ne '237DEE23939CDABFC96EF859FC5E584B842C3A5557E0D2CA744E1F87C14C5844') { throw "Unexpected SHA256: $hash" }
          7z x work\original.7z -owork\extracted -y | Out-Null
          Remove-Item work\original.7z -Force
          $root = (Get-ChildItem work\extracted -Directory | Select-Object -First 1).FullName
          if (-not $root) { $root = (Resolve-Path work\extracted).Path }
          "bundle_root=$root" | Set-Content report\bundle-root.txt
          $exe = Get-ChildItem $root -Recurse -File -Filter faster-whisper-xxl.exe | Select-Object -First 1
          if (-not $exe) { throw 'faster-whisper-xxl.exe not found' }
          "exe=$($exe.FullName)" | Set-Content report\exe-path.txt

      - name: Inspect frozen module archive and current versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pyinstaller==6.12.0 pefile
          $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
          $exe = Get-ChildItem $root -Recurse -File -Filter faster-whisper-xxl.exe | Select-Object -First 1
          & pyi-archive_viewer.exe --recursive --brief $exe.FullName *>&1 | Out-String -Width 8192 | Set-Content report\pyinstaller-recursive.txt

          $interesting = @(
            '_xxl_data\torch\version.py',
            '_xxl_data\torchvision\version.py',
            '_xxl_data\torchaudio\version.py',
            '_xxl_data\onnxruntime\__init__.py',
            '_xxl_data\onnxruntime\capi\onnxruntime_validation.py',
            '_xxl_data\ctranslate2\__init__.py'
          )
          foreach ($rel in $interesting) {
            $p = Join-Path $root $rel
            if (Test-Path $p) {
              "===== $rel =====" | Add-Content report\current-version-files.txt
              Get-Content $p | Add-Content report\current-version-files.txt
            }
          }

          $patterns = 'torch','torchvision','torchaudio','ctranslate2','onnxruntime','faster_whisper'
          $listing = Get-Content report\pyinstaller-recursive.txt -Raw
          foreach ($pat in $patterns) {
            "===== $pat =====" | Add-Content report\frozen-package-presence.txt
            ($listing -split "`r?`n" | Where-Object { $_ -match [regex]::Escape($pat) } | Select-Object -First 300) | Add-Content report\frozen-package-presence.txt
          }

      - name: Download modern CTranslate2 and latest Python-3.10 ONNX Runtime wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip index versions ctranslate2 *>&1 | Out-String -Width 4096 | Set-Content report\ctranslate2-index.txt
          python -m pip index versions onnxruntime-gpu *>&1 | Out-String -Width 4096 | Set-Content report\onnxruntime-index.txt
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --no-deps ctranslate2==4.8.1 -d wheels
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --no-deps onnxruntime-gpu -d wheels
          Get-ChildItem wheels -File | Select-Object Name,Length,@{n='SHA256';e={(Get-FileHash $_.FullName -Algorithm SHA256).Hash}} | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content report\downloaded-wheels.txt

      - name: Inspect modern wheels and PE dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem wheels -Filter *.whl | ForEach-Object {
            $dest = Join-Path stage $_.BaseName
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path $_.FullName -DestinationPath $dest -Force
            "===== $($_.Name) =====" | Add-Content report\wheel-files.txt
            Get-ChildItem $dest -Recurse -File | ForEach-Object { $_.FullName.Substring($dest.Length).TrimStart('\') } | Sort-Object | Add-Content report\wheel-files.txt
            Get-ChildItem $dest -Recurse -File -Filter METADATA | ForEach-Object {
              "===== $($_.FullName.Substring($dest.Length).TrimStart('\')) =====" | Add-Content report\wheel-metadata.txt
              Get-Content $_.FullName | Where-Object { $_ -match '^(Name|Version|Requires-Python|Requires-Dist):' } | Add-Content report\wheel-metadata.txt
            }
          }

          Get-ChildItem stage -Recurse -File -Include *.pyd,*.dll | ForEach-Object {
            "===== $($_.FullName.Substring((Resolve-Path stage).Path.Length).TrimStart('\')) =====" | Add-Content report\pe-dependencies.txt
            & pyi-bindepend.exe $_.FullName *>&1 | Out-String -Width 4096 | Add-Content report\pe-dependencies.txt
          }

      - name: Record runner disk usage
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,2)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize | Out-String | Set-Content report\disk.txt

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-xxl-modern-runtime-probe
          path: report
          if-no-files-found: error
          retention-days: 3
