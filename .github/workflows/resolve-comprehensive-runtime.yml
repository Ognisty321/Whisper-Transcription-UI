name: Resolve comprehensive Windows runtime

on:
  push:
    branches:
      - automation/comprehensive-modernization-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out requirements
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Resolve pinned runtime and binary wheel availability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path resolve-report | Out-Null
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed --only-binary=:all: `
            --no-binary=antlr4-python3-runtime `
            --extra-index-url https://download.pytorch.org/whl/cu128 `
            --report resolve-report\pip-resolution.json `
            -r requirements\xxl-modern-win-py310.txt `
            *>&1 | Tee-Object -FilePath resolve-report\pip-resolution.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned runtime resolution failed: $LASTEXITCODE" }

      - name: Summarize selected distributions
        shell: pwsh
        run: |
          python tools\summarize_pip_report.py resolve-report\pip-resolution.json resolve-report\selected.tsv
          if ($LASTEXITCODE -ne 0) { throw "Resolution summary failed: $LASTEXITCODE" }

      - name: Upload resolution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-xxl-comprehensive-runtime-resolution
          path: resolve-report
          if-no-files-found: error
          retention-days: 14
