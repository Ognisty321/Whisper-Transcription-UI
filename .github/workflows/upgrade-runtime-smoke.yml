name: Smoke-test modern RTX 50 runtime

on:
  push:
    branches:
      - automation/faster-whisper-xxl-rtx50-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-smoke:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_ENABLE_HF_TRANSFER: '0'
    steps:
      - name: Check out reconstruction tools
        uses: actions/checkout@v4

      - name: Set up matching Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Download and extract verified original release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work, report | Out-Null
          $url = 'https://github.com/Purfview/whisper-standalone-win/releases/download/Faster-Whisper-XXL/Faster-Whisper-XXL_r245.4_windows.7z'
          curl.exe -L --fail --retry 5 --retry-delay 5 --output work\original.7z $url
          $size = (Get-Item work\original.7z).Length
          $hash = (Get-FileHash work\original.7z -Algorithm SHA256).Hash
          "size=$size`nsha256=$hash" | Set-Content report\original-archive.txt
          if ($size -ne 1424256246) { throw "Unexpected archive size: $size" }
          if ($hash -ne '237DEE23939CDABFC96EF859FC5E584B842C3A5557E0D2CA744E1F87C14C5844') { throw "Unexpected SHA256: $hash" }
          7z x work\original.7z -owork\extracted -y | Out-Null
          Remove-Item work\original.7z -Force
          $root = (Get-ChildItem work\extracted -Directory | Select-Object -First 1).FullName
          if (-not $root) { throw 'Bundle root not found' }
          "bundle_root=$root" | Set-Content report\bundle-root.txt

      - name: Externalize original PyInstaller code
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input pyinstaller==6.12.0
          $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
          $exe = Join-Path $root 'faster-whisper-xxl.exe'
          $contents = Join-Path $root '_xxl_data'
          python tools\externalize_pyz.py $exe $contents `
            --scripts-dir (Join-Path $contents 'xxl_original_scripts') `
            --manifest (Join-Path $contents 'xxl_externalization_manifest.json') `
            *>&1 | Tee-Object -FilePath report\externalize.txt
          Copy-Item (Join-Path $contents 'xxl_externalization_manifest.json') report\xxl_externalization_manifest.json

      - name: Install coherent CUDA 12.8 runtime stack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work\modern | Out-Null
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --no-deps `
            --target work\modern `
            --index-url https://download.pytorch.org/whl/cu128 `
            torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 `
            *>&1 | Tee-Object -FilePath report\pip-pytorch.txt
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir --no-deps `
            --target work\modern `
            ctranslate2==4.8.1 onnxruntime-gpu==1.23.2 `
            *>&1 | Tee-Object -FilePath report\pip-runtime.txt

          Get-ChildItem work\modern -Force | Select-Object Name,@{n='Size';e={if ($_.PSIsContainer) {(Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum} else {$_.Length}}} | Sort-Object Name | Export-Csv report\modern-stage.csv -NoTypeInformation -Encoding utf8

          $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
          $contents = Join-Path $root '_xxl_data'
          $replace = @('torch','torchgen','functorch','torchvision','torchaudio','ctranslate2','onnxruntime')
          foreach ($name in $replace) {
            $path = Join-Path $contents $name
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }
          Get-ChildItem $contents -Directory | Where-Object {
            $_.Name -match '^(torch|torchvision|torchaudio|ctranslate2|onnxruntime_gpu)-.*\.dist-info$'
          } | Remove-Item -Recurse -Force
          Copy-Item work\modern\* $contents -Recurse -Force

      - name: Build and merge reconstructed launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
          pyinstaller --noconfirm --clean --onedir --console `
            --name faster-whisper-xxl `
            --contents-directory _xxl_data `
            --distpath work\launcher-dist `
            --workpath work\launcher-build `
            --specpath work\launcher-spec `
            tools\xxl_launcher.py *>&1 | Tee-Object -FilePath report\pyinstaller-build.txt
          $launcherRoot = (Resolve-Path 'work\launcher-dist\faster-whisper-xxl').Path
          Copy-Item (Join-Path $launcherRoot 'faster-whisper-xxl.exe') (Join-Path $root 'faster-whisper-xxl.exe') -Force
          Copy-Item (Join-Path $launcherRoot '_xxl_data\*') (Join-Path $root '_xxl_data') -Recurse -Force

      - name: Verify exact package versions and critical DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
          $contents = Join-Path $root '_xxl_data'
          python tools\verify_modern_runtime.py $contents --output report\runtime-versions.json *>&1 | Tee-Object -FilePath report\runtime-verification.txt

      - name: Smoke-test rebuilt CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
          $exe = Join-Path $root 'faster-whisper-xxl.exe'
          Push-Location $root
          try {
            & $exe --help *>&1 | Out-String -Width 8192 | Set-Content "$env:GITHUB_WORKSPACE\report\help.txt"
            $helpExit = $LASTEXITCODE
            & $exe --version *>&1 | Out-String -Width 8192 | Set-Content "$env:GITHUB_WORKSPACE\report\version.txt"
            $versionExit = $LASTEXITCODE
            & $exe --checkcuda *>&1 | Out-String -Width 8192 | Set-Content "$env:GITHUB_WORKSPACE\report\checkcuda.txt"
            $cudaExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          "help_exit=$helpExit`nversion_exit=$versionExit`ncheckcuda_exit=$cudaExit" | Set-Content report\cli-smoke-status.txt
          if ($helpExit -ne 0 -or $versionExit -ne 0 -or $cudaExit -ne 0) { throw 'One or more CLI smoke tests failed' }

      - name: Run end-to-end CPU transcription test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path report\inference, work\models | Out-Null
          $wav = (Resolve-Path report).Path + '\\decoder-test.wav'
          python tools\generate_test_wav.py $wav
          $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
          $exe = Join-Path $root 'faster-whisper-xxl.exe'
          & $exe $wav `
            --model tiny.en `
            --model_dir (Resolve-Path work\models).Path `
            --device cpu `
            --compute_type int8 `
            --output_dir (Resolve-Path report\inference).Path `
            --output_format txt `
            --verbose false `
            *>&1 | Tee-Object -FilePath report\inference-log.txt
          $exitCode = $LASTEXITCODE
          "inference_exit=$exitCode" | Set-Content report\inference-status.txt
          if ($exitCode -ne 0) { throw "CPU inference failed with exit code $exitCode" }
          Get-ChildItem report\inference -Recurse -File | Select-Object Name,Length | Format-Table -AutoSize | Out-String | Set-Content report\inference-files.txt

      - name: Record final test bundle footprint
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path report | Out-Null
          if (Test-Path report\bundle-root.txt) {
            $root = (Get-Content report\bundle-root.txt) -replace '^bundle_root=', ''
            if (Test-Path $root) {
              $files = Get-ChildItem $root -Recurse -File
              $size = ($files | Measure-Object Length -Sum).Sum
              "files=$($files.Count)`nuncompressed_bytes=$size" | Set-Content report\bundle-footprint.txt
            }
          }
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,2)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,2)}} | Format-Table -AutoSize | Out-String | Set-Content report\disk.txt

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-xxl-modern-runtime-smoke
          path: report
          if-no-files-found: error
          retention-days: 3
